# This is a basic workflow to help you get started with Actions

name: projBioSite

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    # Rodar por comando
    runs-on: ubuntu-latest

    steps:
      # Baixar o repositório
      - name: Baixar o repositório
        uses: actions/checkout@v7

      # Configurar o Node.js + Instalação
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # Instalar Dependências
      - name: Instalar Dependencias
        run: npm install

    # Verificar o CSS (Stylelint)
      - name: Verificar CSS
        run: |
          npx stylelint "**/*.css"

      # Verificar o HTML (HtmlHint)
      - name: Verificar + Validar o Html
        run: |
          npm install -g html-validator-cli && html-validator --file "**/*.html"
